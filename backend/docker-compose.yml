name: ecosense-backend

include:
  - ../simulator/docker-compose.yml

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecosense
      POSTGRES_PASSWORD: ecosense
      POSTGRES_DB: ecosense
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosense -d ecosense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
