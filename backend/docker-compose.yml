# Postgres para desenvolvimento local.
#   docker compose up -d
# Depois: npm run prisma:migrate && npm run db:seed
services:
  db:
    image: postgres:17-alpine
    container_name: ecosense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecosense
      POSTGRES_PASSWORD: ecosense
      POSTGRES_DB: ecosense
    ports:
      - "5432:5432"
    volumes:
      - ecosense-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosense -d ecosense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecosense-pgdata:
